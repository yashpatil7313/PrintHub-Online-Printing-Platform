<!DOCTYPE html>
<html>

<head>

    <title>Smart Printing System</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🖨 Smart Printing System</h1>

            <p class="subtitle">
                Upload and manage print jobs
            </p>

            <form id="printForm">

                <label>Select File</label>

                <input type="file" id="file" required>

                <label>Color Mode</label>

                <select id="colorMode">

                    <option value="Color">Color</option>

                    <option value="Black & White">
                        Black & White
                    </option>

                </select>

                <label>Copies</label>

                <input type="number" id="copies" required>

                <button type="submit">

                    Send Print Job

                </button>

            </form>

            <a href="dashboard.html">

                Open Dashboard

            </a>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
